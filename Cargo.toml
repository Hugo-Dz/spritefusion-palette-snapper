[package]
name = "spritefusion-palette-snapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Apply any palette to your pixel art, or reduce it to a few clean colors."
license = "MIT"
readme = "README.md"
homepage = "https://www.spritefusion.com/palette-snapper"
repository = "https://github.com/Hugo-Dz/spritefusion-palette-snapper"
keywords = ["pixel-art", "palette", "cli", "wasm", "gamedev"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spritefusion-palette-snapper"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pixel counts and dimensions are bounded before use.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
# OKLab is a name, not code.
doc_markdown = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
